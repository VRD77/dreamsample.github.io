<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamnity | Campaign Content Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
    .text-gradient { background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .reel-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .reel-btn.active { background-color: #111827; border-left: 4px solid #6366f1; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); color: #ffffff; }
    .reel-btn.inactive { background-color: transparent; border-left: 4px solid transparent; color: #9ca3af; }
    .reel-btn.inactive:hover { background-color: #0f172a; color: #f3f4f6; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #374151; border-radius: 10px; }
</style>
</head>
<body class="antialiased pb-24 selection:bg-indigo-900 selection:text-indigo-200">

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12">
    <header class="mb-12 border-b border-slate-900 pb-10 text-center md:text-left">
        <div class="inline-block px-3 py-1 rounded-full bg-indigo-950/50 text-indigo-400 border border-indigo-900/50 mb-4 font-bold text-xs uppercase tracking-widest">
            Audience Content Portal
        </div>
        <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight text-white">
            <span class="text-gradient">Dreamnity</span> Strategic Assets
        </h1>
        <p class="text-base text-slate-400 max-w-2xl leading-relaxed">
            Content strategy for Phase 1. Cycle 1 builds compliance foundations, Cycle 2 accelerates scaling with high-engagement trends.
        </p>
    </header>

    <div class="flex bg-slate-950 p-1.5 rounded-2xl border border-slate-900 max-w-sm mb-8">
        <button onclick="switchCycle(1)" id="btn-cycle-1" class="flex-1 py-3 px-5 rounded-xl font-heading font-bold text-sm bg-indigo-600 text-white transition-all shadow-md">Cycle 1</button>
        <button onclick="switchCycle(2)" id="btn-cycle-2" class="flex-1 py-3 px-5 rounded-xl font-heading font-bold text-sm text-slate-400 hover:text-slate-200 transition-all">Cycle 2</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 flex flex-col gap-3 max-h-[600px] overflow-y-auto custom-scrollbar pr-2" id="reel-nav"></div>
        <div class="lg:col-span-2 bg-slate-950 rounded-3xl border border-slate-900 p-8 min-h-[600px] flex flex-col" id="script-content"></div>
    </div>
</div>

<script>
    let currentCycle = 1;
    const reelsData = [
        // CYCLE 1
        { id: 1, cycle: 1, type: 'reel', title: "Reel 1: Vendor Onboarding Trap", target: "Corporate AP Compliance", blocks: [{ time: "0:00", type: "Hook", audio: "If your corporate client loves your pitch but ghosts you during vendor onboarding, this is why.", visual: "B-roll of long corporate vendor forms." }] },
        { id: 2, cycle: 1, type: 'reel', title: "Reel 2: Export Tax Myth", target: "GST/LUT Compliance", blocks: [{ time: "0:00", type: "Hook", audio: "Thinking you don't need to file GST for international work? That is a massive mistake.", visual: "Actor holding an export document." }] },
        { id: 3, cycle: 1, type: 'reel', title: "Reel 3: Canva Invoice Fail", target: "Invoicing Standards", blocks: [{ time: "0:00", type: "Hook", audio: "Your Canva-designed PDF isn't a tax invoice, and that is why your payment is delayed.", visual: "Pretty invoice being crumpled up." }] },
        { id: 4, cycle: 1, type: 'reel', title: "Reel 4: 18% Dead Cost", target: "ITC Understanding", blocks: [{ time: "0:00", type: "Hook", audio: "To charge premium rates, stop sending receipts and start sending GST invoices.", visual: "Split screen of receipt vs GST Invoice." }] },
        { id: 5, cycle: 1, type: 'reel', title: "Reel 5: The Solo-Compliance Trap", target: "Business Structuring", blocks: [{ time: "0:00", type: "Hook", audio: "Stop registering for GST before you actually have to.", visual: "Actor counting compliance tasks." }] },
        { id: 6, cycle: 1, type: 'reel', title: "Reel 6: The Infrastructure Fix", target: "Merchant of Record Reveal", blocks: [{ time: "0:00", type: "Hook", audio: "This is the legal bypass to bill big brands without the admin headache.", visual: "Dreamnity branding overlay." }] },
        
        // CYCLE 2
        { id: 7, cycle: 2, type: 'reel', title: "Reel 1: 3 Websites Every Freelancer Needs", target: "Outreach & Pitching", blocks: [{ time: "0:00", type: "Hook", audio: "Freelancing in 2026 and not using these three sites? You're doing it the hard way.", visual: "Rapid fire screen recordings." }] },
        { id: 8, cycle: 2, type: 'reel', title: "Reel 2: Why Clients Ghost You", target: "Client Communication", blocks: [{ time: "0:00", type: "Hook", audio: "If clients keep ghosting you, you're probably making these three basic mistakes.", visual: "Confused client vs professional freelancer comparison." }] },
        { id: 9, cycle: 2, type: 'carousel', title: "Reel 3: The Freelancer Skill Tree", target: "Self-Analysis/Education", blocks: [{ time: "Slide 1", type: "Visual", audio: "Your build: Finding Clients - MAXED. Getting Paid - LOCKED.", visual: "RPG Skill tree interface." }] },
        { id: 10, cycle: 2, type: 'reel', title: "Reel 4: Client Perspective", target: "Trust & Perception", blocks: [{ time: "0:00", type: "Hook", audio: "Would you hire yourself as a freelancer? Look at it through the client's eyes.", visual: "Actor in blazer, looking at a freelance proposal." }] },
        { id: 11, cycle: 2, type: 'reel', title: "Reel 5: Freelancer vs Agency", target: "Brand Positioning", blocks: [{ time: "0:00", type: "Hook", audio: "Why do companies choose agencies when freelancers do the work for half the price?", visual: "Side-by-side comparison." }] },
        { id: 12, cycle: 2, type: 'carousel', title: "Reel 6: The Freelancer Iceberg", target: "Metaphorical Value", blocks: [{ time: "Slide 1", type: "Visual", audio: "The freelance iceberg: What people see vs what actually keeps your business alive.", visual: "Cinematic iceberg illustration." }] }
    ];

    function switchCycle(cycle) {
        currentCycle = cycle;
        renderNav();
        selectReel(reelsData.filter(r => r.cycle === cycle)[0].id);
    }

    function renderNav() {
        const container = document.getElementById('reel-nav');
        container.innerHTML = '';
        reelsData.filter(r => r.cycle === currentCycle).forEach((r, i) => {
            const btn = document.createElement('button');
            btn.className = 'reel-btn inactive w-full text-left px-5 py-4 rounded-xl mb-2 flex flex-col';
            btn.id = `btn-${r.id}`;
            btn.innerHTML = `<span class="text-xs font-bold uppercase">${r.type} ${i+1}</span><span class="font-bold">${r.title}</span>`;
            btn.onclick = () => selectReel(r.id);
            container.appendChild(btn);
        });
    }

    function selectReel(id) {
        document.querySelectorAll('.reel-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${id}`).classList.add('active');
        const reel = reelsData.find(r => r.id === id);
        const content = document.getElementById('script-content');
        content.innerHTML = `<h2 class="text-3xl font-black mb-4">${reel.title}</h2><p class="text-indigo-400 mb-6">${reel.target}</p><div class="space-y-4 text-slate-300">
            ${reel.blocks.map(b => `<div class="p-4 bg-slate-900 rounded-lg"><strong>${b.type}:</strong> ${b.audio}</div>`).join('')}
        </div>`;
    }

    renderNav();
    selectReel(1);
</script>
</body>
</html>
