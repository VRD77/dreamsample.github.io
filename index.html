<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamnity | Organic Virality Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
        h1, h2, h3, h4, h5, .font-heading { font-family: 'Outfit', sans-serif; }
        .text-gradient { background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .reel-btn.active { background-color: #111827; border-left: 4px solid #6366f1; color: #ffffff; }
        .reel-btn.inactive { background-color: transparent; border-left: 4px solid transparent; color: #9ca3af; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #374151; border-radius: 10px; }
        .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body class="antialiased pb-24">

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12">
    <header class="mb-12 border-b border-slate-900 pb-10 text-center md:text-left">
        <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight text-white">
            Dreamnity <span class="text-gradient">Content Engine</span>
        </h1>
        <p class="text-slate-400">Integrated Cycle 2 Reels & Carousel Assets.</p>
    </header>

    <div class="flex bg-slate-950 p-1.5 rounded-2xl border border-slate-900 max-w-lg mb-8">
        <button onclick="renderAssets(1)" class="flex-1 py-3 px-5 rounded-xl font-bold text-sm bg-indigo-600 text-white">Cycle 1: B2B Foundations</button>
        <button onclick="renderAssets(2)" class="flex-1 py-3 px-5 rounded-xl font-bold text-sm text-slate-400">Cycle 2: Advanced Scaling</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 max-h-[680px] overflow-y-auto custom-scrollbar pr-2" id="asset-nav"></div>
        <div class="lg:col-span-2 bg-slate-950 rounded-3xl border border-slate-900 p-6 md:p-10 min-h-[600px]" id="asset-content"></div>
    </div>
</div>

<script>
    const assets = [
        // --- CYCLE 2 REELS (Updated with files) ---
        { id: 7, cycle: 2, type: 'Reel', title: '3 Mistakes That Make Clients Ghost Freelancers', content: [
            { time: '0:00-0:05', audio: 'If clients keep disappearing after showing interest… you might be making one of these mistakes without realizing it.' },
            { time: '0:05-0:20', audio: 'Vague messaging: stop listing services like "editing, design, marketing". Explain the specific result: "I help gyms create videos that increase leads."' },
            { time: '0:20-0:34', audio: 'Slow responses: replying 8 hours later loses clients. Keep conversations alive with quick updates.' },
            { time: '0:34-0:52', audio: 'Unprofessionalism: not having GST invoices or payment workflows kills trust. Dreamnity simplifies this.' }
        ]},
        { id: 8, cycle: 2, type: 'Reel', title: 'Client Perspective: Why Talent Isn\'t Enough', content: [
            { time: '0:00-0:08', audio: 'Imagine you hire a talented freelancer. Portfolio is great. Price works. Everything seems perfect.' },
            { time: '0:08-0:25', audio: 'But finance asks: "Can they provide proper invoices? How do we process payments?" Suddenly, hiring feels risky.' },
            { time: '0:35-0:52', audio: 'Dreamnity allows freelancers to offer GST-ready invoicing and compliant billing, so businesses get the structure they expect.' }
        ]},
        // --- CYCLE 2 CAROUSELS (Updated with files) ---
        { id: 101, cycle: 2, type: 'Carousel', title: 'The Freelancer Iceberg', content: [
            { slide: '1', text: 'What people see vs what runs your business. Finding clients (20% visible) vs. The hidden 80%: Tax, Invoices, Compliance.' },
            { slide: '2', text: 'The part nobody talks about: Chasing payments, international transfers, and GST questions.' },
            { slide: '3', text: 'Dreamnity acts as the submarine navigating the hidden obstacles: GST-ready invoicing, global payments, and payout tracking.' },
            { slide: '4', text: 'Most freelancers upgrade skills. The best upgrade their systems. Look like a business, work like a freelancer.' }
        ]}
    ];

    function renderAssets(cycle) {
        const nav = document.getElementById('asset-nav');
        nav.innerHTML = assets.filter(a => a.cycle === cycle).map(a => `
            <button onclick="showAsset(${a.id})" class="w-full text-left p-4 rounded-2xl mb-2 bg-slate-900 border border-slate-800 hover:border-indigo-500">
                <span class="text-[10px] font-bold text-indigo-400">${a.type.toUpperCase()}</span>
                <div class="font-bold">${a.title}</div>
            </button>
        `).join('');
    }

    function showAsset(id) {
        const asset = assets.find(a => a.id === id);
        const content = document.getElementById('asset-content');
        content.innerHTML = `<h2 class="text-2xl font-bold mb-6">${asset.title}</h2>` + 
            asset.content.map(c => `<div class="mb-4 p-4 bg-slate-900 rounded-xl">${c.time || 'Slide ' + c.slide}: ${c.audio || c.text}</div>`).join('');
    }

    renderAssets(2);
</script>
</body>
</html>
