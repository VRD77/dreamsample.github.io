function switchCycle(cycle){

currentCycle = cycle;

document.getElementById('btn-cycle-1')
.classList.remove('bg-indigo-600','text-white');

document.getElementById('btn-cycle-2')
.classList.remove('bg-indigo-600','text-white');

document.getElementById(`btn-cycle-${cycle}`)
.classList.add('bg-indigo-600','text-white');

renderNav();

const firstReel = reelsData.find(
reel => reel.cycle === cycle
);

if(firstReel){
selectReel(firstReel.id);
}
}

function renderNav(){

const container = document.getElementById('reel-nav');

container.innerHTML = '';

reelsData
.filter(r => r.cycle === currentCycle)
.forEach((r,index)=>{

const btn = document.createElement('button');

btn.className =
'reel-btn inactive w-full text-left px-5 py-4 rounded-xl';

btn.id = `btn-${r.id}`;

btn.innerHTML = `
<span class="text-[10px] font-bold uppercase tracking-widest text-indigo-400">
${r.type}
</span>

<span class="font-bold text-sm mt-1 block">
${r.title}
</span>

<span class="text-xs text-slate-500 mt-2 block">
${r.target}
</span>
`;

btn.onclick = () => selectReel(r.id);

container.appendChild(btn);

});
}

function selectReel(id){

document.querySelectorAll('.reel-btn').forEach(btn=>{
btn.classList.remove('active');
btn.classList.add('inactive');
});

const activeBtn = document.getElementById(`btn-${id}`);

activeBtn.classList.remove('inactive');
activeBtn.classList.add('active');

const reel = reelsData.find(r => r.id === id);

const content = document.getElementById('script-content');

content.innerHTML = `

<div class="mb-8">

<div class="flex items-center gap-3 mb-4">

<span class="px-3 py-1 rounded-full bg-indigo-900/50 text-indigo-300 text-xs font-bold uppercase">

renderNav();
